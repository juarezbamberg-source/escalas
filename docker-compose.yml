services:
  backend:
    build: .
    container_name: escalas-backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - escalas_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: escalas-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  escalas_data:
